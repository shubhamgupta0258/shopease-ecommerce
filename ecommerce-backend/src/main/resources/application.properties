# App Name
spring.application.name=E-commerce

# Server port: Railway (and most PaaS) inject PORT at runtime.
server.port=${PORT:8080}

# Database: defaults to a local H2 file DB for local/dev use.
# In production, override spring.datasource.* via environment variables
# (e.g. SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)
# to point at a real Postgres instance. Hibernate auto-detects the SQL dialect
# from the JDBC connection, so no dialect property is needed here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:~/ecommerce_db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (only relevant when running against the local H2 DB)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Comma-separated list of allowed frontend origins for CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.level.org.springframework.security=DEBUG

# JWT secret: override via the JWT_SECRET environment variable in any real deployment.
# The value below is a placeholder default so the app still runs out of the box for local/demo use.
app.jwtSecret=${JWT_SECRET:nUn8Y5DLeUUy0+RrBsIdu2EElQaezpRXUFZRCMlrpGY=}
app.jwtExpirationMs=86400000
app.refreshExpirationsMs=604800000

# Razorpay (test mode keys) — safe to keep as defaults since test-mode keys can't move real money.
# Override via RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET env vars for your own Razorpay test account.
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_RdfoF9GqogCAKS}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:XKgdBMaYfa6lEIXhQE0gLED3}


